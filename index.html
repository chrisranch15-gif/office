<script>

];
const S = { theme: 'daylight', data: {}, err: {}, busy: {}, sheet: null, inbox: null, cal: null, posts: null, at: null };

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const k$ = n => n == null || isNaN(n) ? '—' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + Math.round(n);

const toDate = v => { if (!v) return null; const t = new Date(String(v).replace(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/, '$3-$1-$2')).getTime(); return isNaN(t) ? null : t; };

function doneIds() { const ids = new Set(((S.sheet && S.sheet.done) || []).map(r => r[1])); try { JSON.parse(store('done') || '[]').forEach(i => ids.add(i)); } catch (e) { } return ids; }

  append('Hub done', [[nowStamp(), m.id, how, m.subject]]).catch(() => { }); }

  return { open: all.filter(m => !done.has(m.id) && !m.replied), replied: all.filter(m => !done.has(m.id) && m.replied), cleared: all.filter(m => done.has(m.id)) }; }

  chart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',

    try { const g = await tool('Gmail', 'get_thread', { threadId: t, messageFormat: 'PLAIN_TEXT' }); S.offerMail[t] = ((g && g.messages) || []).filter(m => !/no-?reply|do-?not-?reply|mailer-daemon|notifications?@/i.test(m.sender || '')); }
    catch (err) { S.offerMail[t] = { error: err.message || 'not available' }; } re(); }
  else if (a === 'fbok') { const id = 'fb:' + b.dataset.k; try { const l = JSON.parse(store('done') || '[]'); l.push(id); store('done', JSON.stringify(l.slice(-300))); } catch (err) { } render(); toast('Removed. Feedback is in.'); append('Hub done', [[nowStamp(), id, 'Feedback received', x || '']]).catch(() => { }); }
  else if (a === 'tccall') { b.disabled = true; tcCall(b.dataset.k, b.dataset.v); }
  else if (a === 'tccopy') { const r = ((S.sheet && S.sheet.shadow) || []).find(r => shadowKey(r) === b.dataset.k); try { await navigator.clipboard.writeText(r ? r[5] : ''); toast('Draft copied.'); } catch (err) { toast('Couldn’t copy on this device.'); } }
  else if (a === 'tcfix') { const box = document.createElement('div'); box.className = 'form'; box.innerHTML = `<textarea rows="3" placeholder="What would you change, or say instead?" style="width:100%"></textarea><div class="acts" style="margin-top:8px"><button class="pill" type="button">Save</button></div>`; b.parentElement.replaceWith(box); box.querySelector('textarea').focus(); box.querySelector('button').onclick = () => { const t = box.querySelector('textarea').value.trim(); if (t) tcCall(b.dataset.k, 'Change it', t); }; }
  else if (a === 'kit') kitSheet(x);
  else if (a === 'rsvp') { b.disabled = true; try { await tool('Google Calendar', 'respond_to_event', { calendarId: b.dataset.c, eventId: b.dataset.id, responseStatus: b.dataset.v }); toast(b.dataset.v === 'accepted' ? 'Accepted.' : 'Declined.'); await loadCalendar(); render(); } catch (err) { b.disabled = false; toast('Didn’t go through — ' + (err.message || 'try again')); } }
  else if (a === 'market') marketSheet(x);
  else if (a === 'sent-network') { try { await append('Marketing', [[nowStamp(), x, 'Agent network email — all 10 offices', '~600 agents', '']]); toast('Logged on the sellers’ portal.'); await loadSheet(); render(); } catch (err) { toast('Not saved — try again.'); } }
});
document.addEventListener('submit', e => { if (e.target.id === 'tell') { e.preventDefault(); const q = $('#tellq').value.trim(); if (q) { $('#tellq').value = ''; caps.sample ? concierge(q) : tell(q); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });


/* ---------- Concierge (office mode): a conversation with Claude through Chris's engine.
   Lookups answer free; drafts and changes come back as proposals he approves with one tap. ---------- */
const CHAT = [];
function concierge(q) {
  if (!$('#cg')) {
    sheet(`<p class="date">Your Concierge</p><h3>How can I help?</h3><div id="cg" class="cg" aria-live="polite"></div>
    <form id="cgf" class="cgf" autocomplete="off"><input id="cgq" placeholder="Ask, or tell me what to do" aria-label="Message your Concierge"><button type="button" id="cgm" class="pill ghost" aria-label="Talk instead of typing">Talk</button><button class="pill">Send</button></form>
    <p class="s" style="margin:10px 0 0;font-size:12px">Drafts wait for your OK. Nothing goes to a client until you send it.</p>`);
    const card = $('#sheet .card'); card.style.maxWidth = '640px';
    $('#cgf').onsubmit = e => { e.preventDefault(); const v = $('#cgq').value.trim(); if (v) { $('#cgq').value = ''; concierge(v); } };
    const SRc = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SRc) $('#cgm').remove(); else $('#cgm').onclick = () => { const r = new SRc(); r.lang = 'en-US'; r.interimResults = true; $('#cgm').textContent = 'Listening…';
      r.onresult = ev => { $('#cgq').value = [...ev.results].map(x => x[0].transcript).join(''); }; r.onend = () => { $('#cgm').textContent = 'Talk'; if ($('#cgq').value.trim()) $('#cgf').requestSubmit(); }; r.start(); };
    drawChat();
  }
  if (!q) return;
  CHAT.push({ role: 'user', content: q }); CHAT.push({ role: 'assistant', content: '', busy: true }); drawChat();
  const history = CHAT.slice(0, -2).filter(m => !m.busy && m.content).map(m => ({ role: m.role, content: m.content }));
  (S.officeMode ? engine({ op: 'ask', q, history, agent: AGENT_NAME_OFFICE }) : claudeAsk(q, history)).then(r => {
    const m = CHAT[CHAT.length - 1]; m.busy = false; m.content = r.text || ''; m.proposals = r.proposals || []; m.route = r.route; drawChat();
  }).catch(err => { const m = CHAT[CHAT.length - 1]; m.busy = false; m.content = /locked/.test(err.message) ? 'Please sign in to your office again.' : err.message; drawChat(); });
}

/* Concierge inside Claude: same chat and approval cards, run on the Claude plan (no API key, no per-use cost) */
const CC_RULES = `You are the Concierge for Chris Ranch, The Ranch Real Estate Group (Keller Williams Realty Puget Sound). You help him run his real estate business.
Rules, always:
- Nothing goes out without Chris. Emails, texts and posts are drafts he sends. You never contact a client.
- When he asks to launch, list or set up a new listing, never say you cannot: propose launch_listing with whatever details he gave.
- Sellers never see buyer's-agent names or details, and buyer's agents never see seller information.
- Every fact comes from the data below, which includes his sorted inbox and the email threads that match his question. Read them; never tell him you cannot see his email. If something is not in the data, say so in one line. Never guess prices, dates or features.
- Deals come first: an offer, counteroffer or deadline on one of his listings is the most important thing in the business. Point it out even if he asked about something else.
- Client-facing drafts speak as Chris ("I"), warm, direct, specific and human. Never mention AI, a system or automation in them.
How you talk to Chris: like a sharp, friendly assistant who knows the business. Lead with the answer. Short paragraphs, plain words, no filler. Ask one clear question if you need something. End with the next step when there is one.
Put any draft or action in "proposals", not in "text".`;
async function claudeAsk(q, history) {
  const sh = S.sheet || {}, tail = (t, n) => (sh[t] || []).slice(-n);
  let sellers = []; try { sellers = (await getRaw('Sellers!A1:G300')).slice(1).filter(r => r[0]).map(r => [r[1], r[2], r[5], r[6] ? 'photo day ' + r[6] : ''].filter(Boolean).join(' | ')); } catch (e) { }
  const inbox = (S.inbox || []).slice(0, 25).map(m => [m.kind, m.urgency, m.replied ? 'replied' : 'not replied', m.from, m.subject, (m.date || ''), m.snippet.slice(0, 160)].join(' | '));
  let mail = '';
  try {
    const ask = q + ' ' + history.slice(-2).map(m => m.content).join(' ');
    const terms = [...new Set((ask.match(/\b\d{3,6}\b/g) || []).concat((q.match(/\b[A-Z][a-z]{2,}\s+[A-Z][a-z]{2,}\b/g) || []).map(n => '"' + n + '"')))];
    const dealy = /offer|counter|inspection|escrow|deal|clos|appraisal|email|mail|repl|wrote|sent|agent|lead/i.test(ask);
    if (terms.length || dealy) {
      const qy = `newer_than:30d ${terms.length ? '(' + terms.join(' OR ') + ')' : ''} ${!terms.length ? DEAL_WORDS : ''}`.trim();
      const hits = await tool('Gmail', 'search_threads', { query: qy, pageSize: 8, view: 'THREAD_VIEW_SUMMARY' });
      const ths = ((hits && hits.threads) || []).slice(0, 4);
      const full = await Promise.all(ths.map(t => tool('Gmail', 'get_thread', { threadId: t.id, messageFormat: 'PLAIN_TEXT' }).catch(() => null)));
      mail = full.filter(Boolean).map(g => { const ms = (g.messages || []).slice(-4); return `THREAD "${(ms[0] || {}).subject || ''}" (${(g.messages || []).length} messages, latest last):\n` +
        ms.map(m => `- ${m.date || ''} ${ME.test(m.sender || '') ? 'CHRIS' : m.sender}: ${String(m.plaintextBody || m.snippet || '').replace(/\n>.*$/gs, '').replace(/\s+/g, ' ').slice(0, 700)}`).join('\n'); }).join('\n\n');
    }
  } catch (e) { mail = 'Email search failed just now: ' + (e.message || e); }
  const ctx = `Today: ${new Date().toString()} (America/Los_Angeles).
LISTINGS (address | city | price | status | sellers | page): ${JSON.stringify(listings().map(l => [l.address, l.city, l.price, l.status, l.sellers, l.page]))}
SELLERS WITH PORTALS: ${JSON.stringify(sellers)}
RECENT LEADS (newest last): ${JSON.stringify(tail('leads', 15))}
DEALS: ${JSON.stringify(tail('deals', 15))}
OFFERS (received | address | buyers | agent | brokerage | price | financing | earnest | credit asked | status | due | notes | email | closing | inspection | SOC offered 17a | SOC asked 17b): ${JSON.stringify(tail('offers', 20).map(r => r.slice(0, 17)))}
RECENT MARKETING: ${JSON.stringify(tail('marketing', 10))}
TODAY'S CALENDAR: ${JSON.stringify((S.cal || []).slice(0, 10).map(e => [e.title, e.start, e.where]))}
INBOX, SORTED (kind | urgency | replied? | from | subject | date | preview): ${JSON.stringify(inbox)}
${mail ? 'EMAIL THREADS MATCHING HIS QUESTION:\n' + mail : ''}`;
  const convo = history.map(m => (m.role === 'user' ? 'Chris: ' : 'You: ') + m.content).join('\n');
  const out = await caps.sample.json(`${CC_RULES}

${ctx}

CONVERSATION SO FAR:
${convo}
Chris: ${q}

Reply as JSON: {"text": "your answer to Chris", "proposals": [{"kind": "email_draft"|"text_draft"|"seller_update"|"event"|"launch_listing"|"log_offer"|"other", "to": "", "subject": "", "body": "", "listing": "", "start": "YYYY-MM-DDTHH:mm:ss local, events only", "end": "same, events only", "location": ""}]}.
For launch_listing put the address in listing and in body a JSON string with any of address, city, price, sellers, photos, notes he gave. For seller_update put the home address in listing. When an offer email in the threads above is not yet in OFFERS, propose log_offer with listing = the address and body = a JSON string of {buyers, agent, brokerage, price, financing, earnest, credit, due, notes} taken only from the email. Use [] when nothing needs approving.`, { modelTier: 'default', cache: false });
  return { text: (out && out.text) || '', proposals: (out && Array.isArray(out.proposals)) ? out.proposals.filter(p => p && p.kind) : [] };
}
const AGENT_NAME_OFFICE = 'Chris Ranch';
function drawChat() {
  const box = $('#cg'); if (!box) return;
  box.innerHTML = CHAT.map((m, i) => m.role === 'user' ? `<div class="cgu">${esc(m.content)}</div>`
    : `<div class="cga">${m.busy ? '<span class="s">Thinking…</span>' : esc(m.content).replace(/\n/g, '<br>')}${(m.proposals || []).map((p, j) => proposalCard(p, i, j)).join('')}${m.route === 'lookup' ? '<div class="cgtag">Answered from your Sheet · free</div>' : ''}</div>`).join('');
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => runProposal(+b.dataset.i, +b.dataset.j, b.dataset.pa, b));
}
const PLABEL = { log_offer: 'Check and log offer', event: 'Add to calendar', launch_listing: 'Review and launch', email_draft: 'Save to Gmail drafts', text_draft: 'Copy text', seller_update: 'Post to their portal', checklist_item: 'Copy item', publish_feedback: 'Open feedback to publish', other: 'Copy' };
function proposalCard(p, i, j) {
  return `<div class="cgp"><div class="s" style="text-transform:uppercase;letter-spacing:.12em;font-size:11px">${esc((p.kind || 'other').replace('_', ' '))}${p.to ? ' · to ' + esc(p.to) : ''}${p.listing ? ' · ' + esc(p.listing) : ''}</div>
  ${p.subject ? `<input class="cgin" data-f="subject" data-i="${i}" data-j="${j}" value="${esc(p.subject)}" aria-label="Subject">` : ''}
  <textarea class="cgin" data-f="body" data-i="${i}" data-j="${j}" rows="5" aria-label="Draft">${esc(p.body)}</textarea>
  <div class="acts" style="margin-top:8px">${p.done ? `<span class="s">${esc(p.done)}</span>` : `<button type="button" class="pill" data-pa="${esc(p.kind)}" data-i="${i}" data-j="${j}">${PLABEL[p.kind] || 'Copy'}</button>${p.kind === 'text_draft' ? `<a class="pill ghost" href="sms:?&body=${encodeURIComponent(p.body)}">Open in Messages</a>` : ''}`}</div></div>`;
}
async function runProposal(i, j, kind, btn) {
  const p = CHAT[i].proposals[j], val = f => { const el = document.querySelector(`.cgin[data-f="${f}"][data-i="${i}"][data-j="${j}"]`); return el ? el.value : (p[f] || ''); };
  p.body = val('body'); p.subject = val('subject'); btn.disabled = true;
  try {
    if (kind === 'email_draft') { await mail('draft', { to: /@/.test(p.to) ? [p.to] : [], subject: p.subject, body: p.body }); p.done = 'Saved to your Gmail drafts. Review and send it from Gmail.'; }
    else if (kind === 'log_offer') { let o = {}; try { o = JSON.parse(p.body); } catch (e) { } o.address = o.address || p.listing; return offerSheet({ id: 'concierge-' + Date.now(), subject: 'Offer on ' + (p.listing || ''), url: '' }, o); }
    else if (kind === 'seller_update') { if (!p.listing) throw new Error('Which listing? Ask me again with the address.'); await append('Seller updates', [[nowStamp(), p.listing, p.subject || 'An update from Chris', p.body, 'Chris']]); p.done = 'Posted to their portal.'; }
    else if (kind === 'publish_feedback') { close(); return feedbackSheet(p.listing || ''); }
    else if (kind === 'event') { if (!p.start) throw new Error('What time? Ask me again with a day and time.'); const st = String(p.start).replace(/(Z|[+-]\d\d:\d\d)$/, ''), en = String(p.end || new Date(Date.parse(st) + 36e5).toISOString().slice(0, 19)).replace(/(Z|[+-]\d\d:\d\d)$/, '');
      await tool('Google Calendar', 'create_event', { calendarId: CALENDARS[0], summary: p.subject || p.body.slice(0, 80), startTime: st, endTime: en, location: p.location || p.listing || '' }); p.done = 'On your calendar.'; loadCalendar().then(render); }
    else if (kind === 'launch_listing') { let d = {}; try { d = JSON.parse(p.body); } catch (e) { d = { notes: p.body }; } close(); return launchSheet(p.listing || d.address || '', Object.assign({ address: p.listing }, d)); }
    else { await navigator.clipboard.writeText(p.body); p.done = 'Copied.'; }
  } catch (err) { btn.disabled = false; return toast(err.message || 'That didn’t work. Try again.'); }
  drawChat();
}

/* ---------- office mode: outside Claude, the same Hub talks to Chris's own Google engine ---------- */
const ENGINE = 'https://script.google.com/macros/s/AKfycbz0ALnuwyuwKaRkr2sGS7N_TPJ3DIXYYRiLP7RiNlBvv5HfQMxfy82jS88ihRab7Duu/exec';
async function engine(body) {
  const key = store('officeKey'); if (!key) throw new Error('locked');
  const r = await fetch(ENGINE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ type: 'office', key }, body)) });
  const j = await r.json(); if (!j.ok) { if (j.reason === 'locked') { store('officeKey', ''); } throw new Error(j.reason || 'Engine error'); } return j;
}
const officeCaps = {
  mcp: { callTool: async (server, name, input) => { if (/Metricool/.test(server)) throw new Error('Metricool opens from its own app.'); return (await engine({ op: 'tool', server, name, input })).result; } },
  sample: { json: async (prompt, opts) => (await engine({ op: 'ai', prompt, opts: opts && opts.modelTier === 'default' ? {} : {} })).result }
};
function unlockSheet(msg) {
  sheet(`<p class="date">office.ranchpnw.com</p><h3>Sign in to your office</h3><p class="s" style="margin:-4px 0 14px">${esc(msg || 'Enter your office password. This device remembers it.')}</p>
  <form id="keyf"><div class="field"><label for="kk">Password</label><input id="kk" name="k" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required><input type="text" name="username" value="Chris" autocomplete="username" style="display:none"></div><div class="acts"><button class="pill">Sign in</button></div></form>`);
  $('#keyf').onsubmit = async e => { e.preventDefault(); store('officeKey', e.target.k.value.trim()); try { const p = await engine({ op: 'ping' }); close(); if (/desk=1/.test(location.search)) return location.replace('/desk/#desk'); caps.mcp = officeCaps.mcp; caps.sample = p.ai ? officeCaps.sample : null; S.office = p; if (!CALENDARS.length && p.emails) CALENDARS = p.emails; loadAll(); toast('Welcome back, Chris.'); } catch (err) { unlockSheet('That password didn’t work. After 8 wrong tries the office locks for an hour.'); } };
}

/* ---------- start ---------- */
S.theme = store('theme') || 'daylight';
try { const c = JSON.parse(store('sheet') || 'null'); if (c && c.out && Date.now() - c.at < 7 * 864e5) { S.sheet = c.out; S.at = c.at; } } catch (e) { }
render();
async function quietRefresh() { if (!caps.mcp || S.busy.all || S.busy.quiet) return; S.busy.quiet = true; try { await loadSheet(); render(); if (!S.busy.inbox && Date.now() - (S.inboxAt || 0) > 5 * 60e3) loadInbox(); } finally { S.busy.quiet = false; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (S.at || 0) > 45e3) quietRefresh(); });
window.addEventListener('pageshow', e => { if (e.persisted) quietRefresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - (S.at || 0) > 150e3) quietRefresh(); }, 30e3);
(async () => {
  if (window.claude && claude.use) {
    const [m, s, d] = await Promise.all(['mcp', 'sample', 'db'].map(n => claude.use(n).catch(() => null)));
    caps.mcp = m; caps.sample = s; caps.db = d;
  } else {
    S.officeMode = true;
    if (!store('officeKey')) { S.ready = true; render(); return unlockSheet(); }
    try { const p = await engine({ op: 'ping' }); caps.mcp = officeCaps.mcp; caps.sample = p.ai ? officeCaps.sample : null; S.office = p; if (!CALENDARS.length && p.emails) CALENDARS = p.emails; }
    catch (err) { S.ready = true; render(); return unlockSheet(err.message === 'locked' ? '' : 'Couldn’t reach your engine: ' + err.message); }
  }
  S.ready = true;
  if (caps.mcp) loadAll(); else render();
})();
</script>
