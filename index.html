<!DOCTYPE html>
<html lang="en">
<head>

<title>Office · The Ranch Real Estate Group</title>

<style>
:root,.t-daylight{--bg:#F7F5F1;--surface:#FFFFFF;--raised:#ECE7DF;--sep:#E6E0D6;--ph:#EAE5DC;--iconbg:#F3E9DA;--text:#1E2327;--text2:#3A3F43;--muted:#6B655C;--chev:#B5AEA3;--accent:#8C6A43;--good:#3F6B45;--warn:#9A4A2E;--btn:#1E2327;--btnText:#F7F5F1;--segOn:#FFFFFF;--shadow:0 1px 2px rgba(30,35,39,.05);--t-need:#A8663A;--t-day:#4C6A8A;--t-mail:#3F7468;--t-run:#7A7A3E;--t-list:#8E5A6B;--t-biz:#5E5A86;--tint:9%}
.t-evening{--bg:#0F1214;--surface:#171B1E;--raised:#1D2226;--sep:#262C30;--ph:#23292D;--iconbg:#2A2419;--text:#F2EEE8;--text2:#CFC9C0;--muted:#A39D94;--chev:#5E5A54;--accent:#D4B48A;--good:#8FC29A;--warn:#E8A86A;--btn:#F2EEE8;--btnText:#0F1214;--segOn:#2E353A;--shadow:none;--t-need:#E0A26E;--t-day:#8FB0D6;--t-mail:#7EC2AE;--t-run:#C9C77F;--t-list:#D59AAE;--t-biz:#A9A4DE;--tint:13%}
.t-heritage{--bg:#1F2A24;--surface:#26332C;--raised:#2E3C34;--sep:#35443B;--ph:#34433A;--iconbg:#3B3A2B;--text:#F3EBDD;--text2:#DDD3C2;--muted:#B3A891;--chev:#7D8A80;--accent:#C9A46A;--good:#A9CDA0;--warn:#E8B07A;--btn:#E9DCC3;--btnText:#1F2A24;--segOn:#3A4A40;--shadow:none;--t-need:#E6A872;--t-day:#9DB8CF;--t-mail:#A8D2B6;--t-run:#D8C27E;--t-list:#D9A39A;--t-biz:#B8B0D8;--tint:14%}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 140px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:'Playfair Display',Georgia,serif;font-size:22px;letter-spacing:.02em}
.seg{display:flex;gap:2px;padding:3px;border-radius:22px;background:var(--raised)}
.seg button{min-height:36px;padding:0 13px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--segOn);color:var(--text);box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--raised);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px}
.hello{margin-top:48px}
.date{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,48px);line-height:1.1;margin:10px 0 0}
.status{margin:14px 0 0;display:flex;align-items:center;gap:10px;font-size:17px;color:var(--text2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)}
section{margin-top:36px}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 10px}
h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.xbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--sep)}.xbtn:hover{color:var(--text)}.row.faded{opacity:.6}.moreline{display:flex;gap:18px;flex-wrap:wrap;padding:6px 4px 0}.pill.launch{gap:8px;min-height:40px;padding:0 18px}.pill.launch svg{width:18px;height:18px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}.jump a{padding:8px 14px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--sep);color:var(--text);text-decoration:none;font-size:14px}.jump a:hover{background:var(--card)}section[id]{scroll-margin-top:16px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-size:14px;cursor:pointer}
.group{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 20px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;background:var(--sep)}
.row.plain+.row.plain:before{left:20px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--iconbg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.body{flex:1 1 200px;min-width:0}
.t{font-size:16px;font-weight:500}
.s{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--btn);color:var(--btnText);font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--sep)}
.pill[disabled]{opacity:.55;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:'Playfair Display',Georgia,serif;font-size:30px;line-height:1.1}
.live{font-size:13px;color:var(--good)}.live.warn{color:var(--warn)}.live.off{color:var(--muted)}
.lrow{display:flex;align-items:center;gap:16px;padding:14px 20px;text-decoration:none;color:var(--text);position:relative;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.lrow+.lrow:before{content:"";position:absolute;top:0;left:100px;right:0;height:1px;background:var(--sep)}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--ph);flex:none}
.chev{color:var(--chev);flex:none}
.empty{padding:18px 20px;color:var(--muted);font-size:15px}
.note{margin:12px 4px 0;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.04em;padding:3px 9px;border-radius:10px;background:var(--raised);color:var(--text2);margin-right:6px}
.tag.now{background:var(--iconbg);color:var(--accent)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 38%);z-index:5}
.dock form{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 8px 0 18px;border-radius:27px;background:var(--surface);box-shadow:0 2px 14px rgba(0,0,0,.08),inset 0 0 0 1px var(--sep)}
.dock input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.dock button{width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:var(--btnText);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .card{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}
.sheet h3{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:26px;margin:4px 0 12px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--surface)}
.field textarea{min-height:140px;resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--btn);color:var(--btnText);padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.skel{height:14px;border-radius:7px;background:var(--raised);width:60%;margin:6px 0}

/* section color: each area of the business carries its own quiet tone */
section{--tone:var(--accent)}
section[data-tone=need]{--tone:var(--t-need)}section[data-tone=day]{--tone:var(--t-day)}section[data-tone=mail]{--tone:var(--t-mail)}section[data-tone=run]{--tone:var(--t-run)}section[data-tone=list]{--tone:var(--t-list)}section[data-tone=biz]{--tone:var(--t-biz)}
section h2{display:flex;align-items:center;gap:10px;color:var(--text2)}
section h2:before{content:"";width:18px;height:2px;border-radius:2px;background:var(--tone)}
section .group:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--tone),color-mix(in srgb,var(--tone) 35%,transparent))}
section .ico{background:color-mix(in srgb,var(--tone) var(--tint),var(--surface));color:var(--tone)}
section[data-tone=need] .group{background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 5%,var(--surface)),var(--surface) 55%)}
.who{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;background:color-mix(in srgb,var(--tone) var(--tint),var(--surface));color:var(--tone)}
.tag{background:color-mix(in srgb,var(--tone,var(--accent)) var(--tint),var(--surface));color:var(--tone,var(--text2))}
.tag.now{background:color-mix(in srgb,var(--t-need) 16%,var(--surface));color:var(--t-need)}
.tile{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 5%,var(--surface)),var(--surface) 70%)}
.tile:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--tone),color-mix(in srgb,var(--tone) 35%,transparent))}
.tile .v{color:var(--text)}
.tile:nth-child(6n+1){--tone:var(--t-run)}.tile:nth-child(6n+2){--tone:var(--t-need)}.tile:nth-child(6n+3){--tone:var(--t-list)}.tile:nth-child(6n+4){--tone:var(--t-day)}.tile:nth-child(6n+5){--tone:var(--t-mail)}.tile:nth-child(6n+6){--tone:var(--t-biz)}
.timecol{color:var(--tone)!important;font-weight:500}
.brand{display:flex;flex-direction:column;line-height:1.1}.brand .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="root"></div>

<script>
'use strict';
/* ============================================================
   RANCH — the hub. Reads and writes the business Sheet, triages
   Gmail with Claude, shows Metricool drafts and (once connected)
   Google Calendar. Nothing is sent without a tap.
   ============================================================ */
const SHEET = '1ROkc-18VbSn7kkLZYrTyJYiooMDLbBxYR0SSWItll2E';
const METRICOOL_BRAND = '6646044';
const DESK_19917 = 'https://claude.ai/artifact/E6iKnuAbJ77ML5sArMqhEq#desk';
const CALENDARS = ['chrisranch@kw.com', 'chrisranch15@gmail.com']; // work first: new events go on the KW calendar
const NET_AGENTS = '~600 agents in 10 offices';
const KITS = { '19917 145th St E': { brochure: 'https://homes.ranchpnw.com/print/19917-145th-St-E-brochure.pdf', social: ['just-listed-post', 'greenbelt-post', 'inside-1', 'inside-2', 'inside-3', 'inside-4', 'just-listed-story', 'greenbelt-story', 'inside-story'].map(n => 'https://homes.ranchpnw.com/social/' + n + '.jpg') } };
const caps = { mcp: null, sample: null, db: null };
const KIT = [
  { ico: 'chart', t: 'Listing presentation', s: 'Seller slides: how you market and sell a home', links: [['Present', 'https://claude.ai/artifact/EeSHsjer6ZmdwBeXiqkh41'], ['Web version', 'https://homes.ranchpnw.com/sell']] },
  { ico: 'doc', t: 'Seller brochure', s: 'Print piece to leave behind at the appointment', links: [['Open to print', 'https://claude.ai/artifact/Lhphx7onzrptYRs3VVsihc']] },
  { ico: 'globe', t: 'Aaron & Holly · launch plan', s: 'Private plan from their Cloud CMA · 19917 145th St E', links: [['Open', 'https://homes.ranchpnw.com/plan/aaron-holly-4d7d4e75ad.html']] },
  { ico: 'doc', t: '19917 · listing brochure', s: 'Two pages, letter size, QR to the listing page', links: [['Print PDF', 'https://homes.ranchpnw.com/print/19917-145th-St-E-brochure.pdf']] },
  { ico: 'chart', t: '19917 · listing films', s: 'Full tour (64s) and vertical for Reels', links: [['Full tour', 'https://homes.ranchpnw.com/social/video/19917-full-tour.mp4'], ['Vertical', 'https://homes.ranchpnw.com/social/video/19917-vertical-30.mp4']] },
  { ico: 'phone', t: 'For agents', s: 'Why agents join The Ranch Real Estate Group', links: [['Present', 'https://claude.ai/artifact/2tnLxKwbXZZkFd4Gz41SxZ']] },
  { ico: 'globe', t: 'For brokerages', s: 'Groundwork: the system as a product', links: [['Present', 'https://claude.ai/artifact/D8brh9kw3wY32NKdebFzqE']] }
];
const S = { theme: 'daylight', data: {}, err: {}, busy: {}, sheet: null, inbox: null, cal: null, posts: null, at: null };

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null || n === '' || isNaN(Number(n)) ? '—' : '$' + Math.round(Number(n)).toLocaleString('en-US');
const k$ = n => n == null || isNaN(n) ? '—' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + Math.round(n);
const ago = t => { if (!t) return ''; const s = (Date.now() - t) / 1000; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const toDate = v => { if (!v) return null; const t = new Date(String(v).replace(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/, '$3-$1-$2')).getTime(); return isNaN(t) ? null : t; };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }
function doneIds() { const ids = new Set(((S.sheet && S.sheet.done) || []).map(r => r[1])); try { JSON.parse(store('done') || '[]').forEach(i => ids.add(i)); } catch (e) { } return ids; }
function markDone(m, how) { try { const l = JSON.parse(store('done') || '[]'); l.push(m.id); store('done', JSON.stringify(l.slice(-300))); } catch (e) { }
  append('Hub done', [[nowStamp(), m.id, how, m.subject]]).catch(() => { }); }
function inboxView() { const done = doneIds(), all = S.inbox || [];
  return { open: all.filter(m => !done.has(m.id) && !m.replied), replied: all.filter(m => !done.has(m.id) && m.replied), cleared: all.filter(m => done.has(m.id)) }; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem('ranch.' + k); localStorage.setItem('ranch.' + k, v); } catch (e) { return null; } }
function payloadOf(r) { let p = r && (r.payload !== undefined ? r.payload : r); if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) {} } if (p && p.content && Array.isArray(p.content)) { const t = p.content.find(c => c.type === 'text'); if (t) { try { p = JSON.parse(t.text); } catch (e) { p = t.text; } } } return p; }
async function tool(server, name, input) { if (!caps.mcp) throw new Error('Open Ranch on claude.ai to connect your accounts.'); return payloadOf(await caps.mcp.callTool(server, name, input)); }
const rows = p => ((p && p.values) || []);
const sheetRows = async range => rows(await tool('Google Sheets', 'get_values', { spreadsheetId: SHEET, range })).slice(1);
const append = (tab, values) => tool('Google Sheets', 'append_values', { spreadsheetId: SHEET, range: tab + '!A1', values });
const nowStamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const I = {
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>',
  mail: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>',
  phone: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  globe: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  cal: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
};

/* ---------- loading ---------- */
async function loadSheet() {
  const tabs = { leads: 'Leads!A1:J400', listings: 'Listings!A1:J60', deals: 'Deals!A1:J300', checks: 'Checks!A1:E400', portals: 'Portals!A1:F200', marketing: 'Marketing!A1:E200', docs: 'Documents!A1:F400', showings: "'Showing agents'!A1:J500", done: "'Hub done'!A1:D2000", shoots: "'Photo shoots'!A1:K200" };
  const out = {};
  await Promise.all(Object.keys(tabs).map(async k => { try { out[k] = await sheetRows(tabs[k]); } catch (e) { out[k] = null; S.err.sheet = e.message || String(e); } }));
  S.sheet = out; S.at = Date.now();
}
async function loadPosts() {
  try {
    const now = new Date(), to = new Date(Date.now() + 21 * 864e5);
    const iso = d => d.toISOString().slice(0, 19) + '-08:00';
    const p = await tool('Metricool Social Media Management', 'getScheduledPosts', { brandId: METRICOOL_BRAND, fromDate: iso(now), toDate: iso(to), timezone: 'America/Los_Angeles' });
    const list = Array.isArray(p) ? p : (p && (p.data || p.posts)) || [];
    S.posts = list.map(x => ({ text: String(x.text || ''), draft: !!x.draft, when: x.publicationDate && x.publicationDate.dateTime, url: x.plannerUrl || 'https://app.metricool.com/planner' }));
  } catch (e) { S.posts = null; S.err.posts = e.message || String(e); }
}
async function loadCalendar() {
  try {
    const loc = d => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T00:00:00`; };
    const start = new Date(); start.setHours(0, 0, 0, 0); const end = new Date(start.getTime() + 2 * 864e5);
    const got = await Promise.all(CALENDARS.map(c => tool('Google Calendar', 'list_events', { calendarId: c, startTime: loc(start), endTime: loc(end), pageSize: 25, orderBy: 'startTime' }).then(p => ({ c, list: (p && p.events) || [] })).catch(() => ({ c, list: [] }))));
    const byId = {};

  <form id="mf"><div class="field"><label for="ma">Area name</label><input id="ma" name="area" value="Tehaleh"></div>
  <div class="field"><label for="mt">Your numbers</label><textarea id="mt" name="txt" placeholder="Oct 2026: median sold $765,000, 18 sold, 54 active, 21 days on market, 2.9 months inventory, 99.1% of list…"></textarea></div>
  <div class="field"><label for="msrc">Source</label><input id="msrc" name="src" value="NWMLS"></div>
  <div class="acts"><button class="pill">Read with Claude</button><button type="button" class="pill ghost" data-act="close">Cancel</button></div></form>`);
  $('#mf').onsubmit = async e => { e.preventDefault(); const f = e.target; if (!caps.sample) return toast('Needs Claude — open Ranch on claude.ai.');
    const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Reading…';
    try {
      const out = await caps.sample.json(`Extract monthly real estate market statistics from the text. Use ONLY numbers present in the text; never estimate or fill gaps (use null).
Return JSON array, one object per month: {"month":"YYYY-MM","median":number|null,"sold":number|null,"active":number|null,"dom":number|null,"moi":number|null,"stl":number|null} where median = median sold price in dollars, sold = homes sold/closed, active = active listings, dom = median (or average) days on market, moi = months of inventory, stl = sale-to-list price percent (e.g. 98.7).
TEXT:
${f.txt.value.slice(0, 8000)}`, { modelTier: 'default', cache: false });
      const rowsM = (Array.isArray(out) ? out : []).filter(r => /^\d{4}-\d{2}$/.test(r.month));
      if (!rowsM.length) throw new Error('No months found');
      sheet(`<p class="date">${esc(a)} · ${esc(f.area.value)}</p><h3>Look right?</h3>
      <div class="group">${rowsM.map(r => `<div class="row plain"><div class="body"><div class="t">${esc(r.month)}</div><div class="s">${[r.median != null ? money(r.median) + ' median' : '', r.sold != null ? r.sold + ' sold' : '', r.active != null ? r.active + ' active' : '', r.dom != null ? r.dom + ' DOM' : '', r.moi != null ? r.moi + ' mo. inventory' : '', r.stl != null ? r.stl + '% of list' : ''].filter(Boolean).join(' · ')}</div></div></div>`).join('')}</div>
      <div class="acts" style="margin-top:16px"><button class="pill" id="msave">Save to their portal</button><button class="pill ghost" data-act="close">Cancel</button></div>`);
      const area = f.area.value.trim(), src = f.src.value.trim();
      $('#msave').onclick = async () => { try { await append('Market', rowsM.map(r => [r.month, a, area, r.median, r.sold, r.active, r.dom, r.moi, r.stl, src])); close(); toast('Charted on the sellers’ portal.'); } catch (err) { toast('Not saved — try again.'); } };
    } catch (err) { b.disabled = false; b.textContent = 'Read with Claude'; toast('Couldn’t read those numbers — ' + (err.message || 'try again')); } };
}
function launchSheet(a) {
  sheet(`<p class="date">Launch a listing</p><h3>Four questions.</h3><p class="s" style="margin:-4px 0 16px">Ranch builds the page, The Desk, the seller portal, three social posts and the agent-network email. Nothing goes public until you approve it.</p>
  <form id="lf"><div class="field"><label for="la">Address</label><input id="la" name="a" value="${esc(a || '')}" required></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label for="lc">City or community</label><input id="lc" name="city"></div><div class="field"><label for="lp">Price</label><input id="lp" name="price" inputmode="numeric"></div></div>
  <div class="field"><label for="lph">Photos (Google Drive folder link)</label><input id="lph" name="photos"></div>
  <div class="field"><label for="lse">Sellers’ first names</label><input id="lse" name="sellers" placeholder="Aaron and Holly"></div>
  <div class="acts"><button class="pill">Start the launch</button><button type="button" class="pill ghost" data-act="close">Cancel</button></div></form>`);
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = e.target;
    try { await append('Listings', [[f.a.value.trim(), f.city.value.trim(), String(f.price.value).replace(/[^\d]/g, ''), 'Preparing', f.sellers.value.trim(), '', '', '', '', '']]);
      await append('Marketing', [[nowStamp(), f.a.value.trim(), 'Launch requested', '', 'Photos: ' + f.photos.value.trim()]]);
      close(); toast('Queued. The launch kit is built in your next Claude session.'); await loadSheet(); render(); } catch (err) { toast('Not saved — try again.'); } };
}

/* ---------- Tell Ranch ---------- */
async function tell(q) {
  if (!caps.sample) return toast('Tell Ranch needs Claude — open Ranch on claude.ai.');
  const ls = listings().map(l => l.address).join('; ');
  sheet(`<p class="date">Tell Ranch</p><h3>${esc(q)}</h3><p class="s">Working it out…</p>`);
  try {
    const out = await caps.sample.json(`You turn a busy real estate agent's request into ONE action for his system. Today is ${new Date().toString()}. Time zone America/Los_Angeles. Listings: ${ls}.
Actions:
- "event": {"title","start" local time "YYYY-MM-DDTHH:mm:ss" with NO offset,"end" same format,"location"} (open houses, showings, meetings; default length 1 hour)
- "email": {"to" (email or ""),"subject","body"} (a draft he will review; warm, brief, his voice, no invented facts)
- "seller_update": {"address","title","message"} (a note on the sellers' portal)
- "marketing": {"address","what","reach","notes"} (log something done to market a listing)
- "deal": {"address","status","price","pct","closing" YYYY-MM-DD}
- "answer": {"text"} (a question about his business you can answer from: LISTINGS ${JSON.stringify(listings().map(l => [l.address, l.price, l.status]))} DEALS ${JSON.stringify(deals().map(d => [d.address, d.status, d.price, d.pct, d.closing && new Date(d.closing).toDateString()]))})
Return JSON {"action": one of the names, "summary": "<= 14 words describing what will happen", "data": {...}}.
REQUEST: ${q}`, { modelTier: 'default', cache: false });
    if (!out || !out.action) throw new Error('No action');
    const dd = out.data || {};
    if (out.action === 'answer') return sheet(`<p class="date">Ranch</p><h3>${esc(q)}</h3><p style="font-size:17px;line-height:1.6">${esc(dd.text)}</p><div class="acts"><button class="pill ghost" data-act="close">Done</button></div>`);
    const fields = Object.keys(dd).map(k => `<div class="field"><label for="tf-${k}">${esc(k)}</label>${k === 'body' || k === 'message' ? `<textarea id="tf-${k}" name="${esc(k)}">${esc(dd[k])}</textarea>` : `<input id="tf-${k}" name="${esc(k)}" value="${esc(dd[k])}">`}</div>`).join('');
    sheet(`<p class="date">Ready when you are</p><h3>${esc(out.summary || q)}</h3><form id="tf">${fields}<div class="acts"><button class="pill">${{ event: 'Add to calendar', email: 'Save to Gmail drafts', seller_update: 'Post to their portal', marketing: 'Log it', deal: 'Save deal' }[out.action] || 'Do it'}</button><button type="button" class="pill ghost" data-act="close">Cancel</button></div></form>`);
    $('#tf').onsubmit = async e => { e.preventDefault(); const f = e.target, v = k => f[k] ? f[k].value : (dd[k] || ''); const b = f.querySelector('button'); b.disabled = true;
      try {
        if (out.action === 'event') await tool('Google Calendar', 'create_event', { calendarId: CALENDARS[0], summary: v('title'), startTime: v('start').replace(/(Z|[+-]\d\d:\d\d)$/, ''), endTime: v('end').replace(/(Z|[+-]\d\d:\d\d)$/, ''), location: v('location') });
        if (out.action === 'email') await tool('Gmail', 'create_draft', { to: v('to') ? [v('to')] : [], subject: v('subject'), body: v('body'), includeSignature: true });
        if (out.action === 'seller_update') await append('Seller updates', [[nowStamp(), v('address'), v('title'), v('message'), 'Chris']]);
        if (out.action === 'marketing') await append('Marketing', [[nowStamp(), v('address'), v('what'), v('reach'), v('notes')]]);
        if (out.action === 'deal') await append('Deals', [[nowStamp(), v('address'), 'Listing', v('status'), v('price'), v('pct'), '', '', v('closing'), '']]);
        close(); toast('Done.'); loadSheet().then(render); if (out.action === 'event') loadCalendar().then(render);
      } catch (err) { b.disabled = false; toast(out.action === 'event' && /connect|unavailable|not_connected|server/i.test(String(err.message || err.code)) ? 'Connect Google Calendar in claude.ai first.' : 'Didn’t go through — ' + (err.message || 'try again')); } };
  } catch (e) { sheet(`<p class="date">Tell Ranch</p><h3>I didn’t catch that.</h3><p class="s">Try “open house Saturday 1–4 at 19917”, “email the Hendersons a thank-you”, or “what’s pending?”</p><div class="acts" style="margin-top:14px"><button class="pill ghost" data-act="close">OK</button></div>`); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, x = b.dataset.a;
  if (a === 'theme') { S.theme = b.dataset.v; store('theme', S.theme); render(); }
  else if (a === 'close') close();
  else if (a === 'refresh') { store('inbox', ''); loadAll(); }
  else if (a === 'inbox') { store('inbox', ''); loadInbox(); }
  else if (a === 'shoot') shootSheet(x || '');
  else if (a === 'shoot-email' || a === 'shoot-site') {
    const f = $('#shootf'); if (!f.reportValidity()) return; const o = shootText(f);
    if (a === 'shoot-email') { b.disabled = true; try { const r = await tool('Gmail', 'create_draft', { to: [RAINIER.email], subject: 'Photo shoot · ' + o.d.address, body: o.body, includeSignature: true }); shootLog(o.d, 'email draft');
        sheet(`<p class="date">Saved to your Gmail drafts</p><h3>Order ready to send</h3><p class="s" style="margin:-4px 0 16px">Give it a last look and send.</p><div class="acts"><a class="pill" href="${esc((r && r.viewUrl) || 'https://mail.google.com/mail/u/0/#drafts')}" target="_blank" rel="noopener noreferrer">Open in Gmail</a><button type="button" class="pill ghost" data-act="close">Done</button></div>`); }
      catch (err) { b.disabled = false; toast('Not saved — ' + (err.message || 'try again')); } }
    else { try { await navigator.clipboard.writeText(o.body); toast('Details copied. Paste into Rainier’s form.'); } catch (e) { } window.open(RAINIER.order, '_blank', 'noopener'); shootLog(o.d, 'site'); }
  }
  else if (a === 'mdone') { const m = (S.inbox || []).find(t => t.id === b.dataset.id); if (m) { markDone(m, 'cleared'); render(); toast('Cleared. It’s under “cleared” if you need it.'); } }
  else if (a === 'later') { S.showLater = true; render(); }
  else if (a === 'past') { S.showPast = !S.showPast; render(); }
  else if (a === 'goinbox') { const el = document.getElementById('inbox'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'reply') { const m = (S.inbox || []).find(t => t.id === b.dataset.id); if (m) replySheet(m); }
  else if (a === 'listing') listingSheet(x);
  else if (a === 'portals') portalsSheet(x);
  else if (a === 'files') filesSheet(x);
  else if (a === 'launch') launchSheet(x);
  else if (a === 'deal') dealSheet();
  else if (a === 'kit') kitSheet(x);
  else if (a === 'rsvp') { b.disabled = true; try { await tool('Google Calendar', 'respond_to_event', { calendarId: b.dataset.c, eventId: b.dataset.id, responseStatus: b.dataset.v }); toast(b.dataset.v === 'accepted' ? 'Accepted.' : 'Declined.'); await loadCalendar(); render(); } catch (err) { b.disabled = false; toast('Didn’t go through — ' + (err.message || 'try again')); } }
  else if (a === 'market') marketSheet(x);
  else if (a === 'sent-network') { try { await append('Marketing', [[nowStamp(), x, 'Agent network email — all 10 offices', '~600 agents', '']]); toast('Logged on the sellers’ portal.'); await loadSheet(); render(); } catch (err) { toast('Not saved — try again.'); } }
});
document.addEventListener('submit', e => { if (e.target.id === 'tell') { e.preventDefault(); const q = $('#tellq').value.trim(); if (q) { $('#tellq').value = ''; tell(q); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });


/* ---------- office mode: outside Claude, the same Hub talks to Chris's own Google engine ---------- */
const ENGINE = 'https://script.google.com/macros/s/AKfycbz0ALnuwyuwKaRkr2sGS7N_TPJ3DIXYYRiLP7RiNlBvv5HfQMxfy82jS88ihRab7Duu/exec';
async function engine(body) {
  const key = store('officeKey'); if (!key) throw new Error('locked');
  const r = await fetch(ENGINE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ type: 'office', key }, body)) });
  const j = await r.json(); if (!j.ok) { if (j.reason === 'locked') { store('officeKey', ''); } throw new Error(j.reason || 'Engine error'); } return j;
}
const officeCaps = {
  mcp: { callTool: async (server, name, input) => { if (/Metricool/.test(server)) throw new Error('Metricool opens from its own app.'); return (await engine({ op: 'tool', server, name, input })).result; } },
  sample: { json: async (prompt, opts) => (await engine({ op: 'ai', prompt, opts: opts && opts.modelTier === 'default' ? {} : {} })).result }
};
function unlockSheet(msg) {
  sheet(`<p class="date">office.ranchpnw.com</p><h3>Unlock your office</h3><p class="s" style="margin:-4px 0 14px">${esc(msg || 'Paste your office key once on this device. It stays on this device only.')}</p>
  <form id="keyf"><div class="field"><label for="kk">Office key</label><input id="kk" name="k" autocomplete="off" autocapitalize="off" spellcheck="false" required></div><div class="acts"><button class="pill">Unlock</button></div></form>`);
  $('#keyf').onsubmit = async e => { e.preventDefault(); store('officeKey', e.target.k.value.trim()); try { const p = await engine({ op: 'ping' }); close(); caps.mcp = officeCaps.mcp; caps.sample = p.ai ? officeCaps.sample : null; S.office = p; loadAll(); toast('Welcome back, Chris.'); } catch (err) { unlockSheet('That key didn’t work. Copy it again from the engine.'); } };
}

/* ---------- start ---------- */
S.theme = store('theme') || 'daylight';
render();
(async () => {
  if (window.claude && claude.use) {
    const [m, s, d] = await Promise.all(['mcp', 'sample', 'db'].map(n => claude.use(n).catch(() => null)));
    caps.mcp = m; caps.sample = s; caps.db = d;
  } else {
    S.officeMode = true;
    if (!store('officeKey')) { S.ready = true; render(); return unlockSheet(); }
    try { const p = await engine({ op: 'ping' }); caps.mcp = officeCaps.mcp; caps.sample = p.ai ? officeCaps.sample : null; S.office = p; }
    catch (err) { S.ready = true; render(); return unlockSheet(err.message === 'locked' ? '' : 'Couldn’t reach your engine: ' + err.message); }
  }
  S.ready = true;
  if (caps.mcp) loadAll(); else render();
})();
</script>
