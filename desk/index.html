<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk · 19917 145th St E</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="theme-color" content="#1E2327">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>/*
VOICE: hushed, assured, editorial — a private-client brochure, never a portal.
IDEA: each listing is a bound monograph; the Concierge is the staff you never see.
PICTURE: the home's own photography, full-bleed, carrying every screen.
COLOUR and TYPE: tenant brand (Ranch: ivory, charcoal, bronze · Playfair Display + Inter).
LAYOUT: generous air, one decision per view, phone first.
*/
:root{--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--ink:#1E2327;--ground:#F7F5F1;--accent:#8C6A43;--night:#16191B;
--muted:#5E584E;--line:#D9D2C6;--card:#FFFFFF;--soft:#EFEBE4;--ok:#3F6B45;--warn:#9A4A2E;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--ground);color:var(--ink);-webkit-text-size-adjust:100%}
body{font:16px/1.6 var(--sans);overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.serif{font-family:var(--serif);font-weight:400}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.narrow{max-width:860px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);text-decoration:none;font-size:15px;letter-spacing:.02em;cursor:pointer;border-radius:0;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--ground)}
.btn.light{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.btn.light:hover{background:transparent;color:var(--ground)}
.btn.line{background:transparent;color:var(--ground);border-color:rgba(247,245,241,.5)}
.btn.line:hover{background:var(--ground);color:var(--ink)}
.btn.text{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px;padding:0 6px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{min-height:48px;padding:12px 14px;border:1px solid var(--line);background:var(--card);font-size:16px;border-radius:0}
.field textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;margin:6px 0 16px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid currentColor}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.acc{color:var(--accent)}.tag.mute{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- Property Story ---------- */
.story{background:var(--ground)}
.hero{position:relative;min-height:min(92vh,900px);height:min(92vh,900px);background:var(--night);color:#F7F5F1;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:settle 2.4s ease-out both}
@keyframes settle{from{transform:scale(1.06);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hero img{animation:none}}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,16,18,.55) 0%,rgba(14,16,18,0) 24%,rgba(14,16,18,0) 46%,rgba(14,16,18,.84) 100%)}
.topnav{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(20px,4vw,48px)}
.topnav .mark{display:flex;flex-direction:column;gap:3px;line-height:1.2}
.topnav .mark .st{font-family:var(--serif);font-size:clamp(17px,2vw,21px);letter-spacing:.01em}
.topnav .mark .ct{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.topnav .tn{display:flex;gap:10px;align-items:center;font-size:13px;letter-spacing:.06em}
.topnav .tn a.cta{text-decoration:none;border:1px solid rgba(247,245,241,.6);padding:0 18px;min-height:44px;display:inline-flex;align-items:center}
.topnav .menu{min-height:44px;padding:0 16px;background:rgba(22,25,27,.35);border:1px solid rgba(247,245,241,.6);color:inherit;cursor:pointer;font-size:13px;letter-spacing:.06em;backdrop-filter:blur(6px)}
.topnav .drop{position:absolute;right:clamp(20px,4vw,48px);top:calc(100% - 6px);width:min(300px,calc(100vw - 40px));background:var(--ground);color:var(--ink);display:flex;flex-direction:column;padding:8px 20px;box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:5}
.topnav .drop a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line);min-height:44px;font-size:15px}
.topnav .drop a:last-child{border-bottom:0}
.topnav .drop .small{color:var(--muted)}
.topnav .drop .sep2{height:10px}
@media (max-width:520px){.topnav .tn a.cta{display:none}}
.hero .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 clamp(20px,4vw,48px) clamp(36px,6vw,72px);max-width:1240px;margin:0 auto}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7.4vw,108px);line-height:1;margin:16px 0 0;letter-spacing:-.01em;max-width:11ch;text-wrap:balance}
.hero .meta{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;margin-top:28px;font-size:15px;letter-spacing:.03em}
.hero .meta .price{font-family:var(--serif);font-size:clamp(24px,2.4vw,32px)}
.hero .eyebrow{color:#E7D7BF}
.ribbon{position:relative;z-index:4;background:var(--accent);color:#fff;text-align:center;font-size:13px;padding:10px 16px}
.lede{padding:clamp(72px,10vw,140px) 0 clamp(56px,8vw,96px);text-align:center}
.lede p.big{font-family:var(--serif);font-size:clamp(24px,3vw,40px);line-height:1.38;margin:0 auto;max-width:28ch;text-wrap:balance}
.lede .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:40px}
.chapter{padding-bottom:clamp(80px,10vw,140px)}
.chapter .head{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding-top:26px;margin-bottom:clamp(28px,4vw,48px)}
.chapter .head .n{font-family:var(--serif);color:var(--accent);font-size:18px}
.chapter h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.2vw,58px);line-height:1.05;margin:0;text-wrap:balance}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(14px,2vw,24px)}
.stackcol{display:flex;flex-direction:column;gap:clamp(14px,2vw,24px)}
.ph{width:100%;object-fit:cover;background:var(--soft);cursor:zoom-in}
.ph.t{height:clamp(320px,46vw,620px)}.ph.m{height:clamp(220px,26vw,340px)}.ph.s{height:clamp(160px,16vw,220px)}
.prose{font-size:17px;line-height:1.75;color:#3A4248;max-width:58ch}
.dark{background:var(--night);color:#F7F5F1}
.dark .prose{color:#D8D2C7}.dark .head{border-color:rgba(247,245,241,.22)}.dark .head .n{color:#D9C2A0}
.dark .chapter{padding-top:clamp(80px,10vw,130px)}
.cap{font-size:12px;letter-spacing:.08em;color:#9C968B;margin-top:12px}
.full{position:relative;height:clamp(520px,70vh,780px);overflow:hidden;background:var(--night);color:#F7F5F1}
.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.full .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,16,18,.8) 0%,rgba(14,16,18,.1) 65%)}
.full .inner{position:relative;padding-top:clamp(80px,12vw,140px)}
.full h2{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5.4vw,76px);line-height:1.02;margin:10px 0 22px;max-width:9ch}
@media (max-width:600px){.full .scrim{background:linear-gradient(180deg,rgba(14,16,18,.1) 20%,rgba(14,16,18,.85) 100%)}.full .inner{position:absolute;bottom:40px;left:0;right:0;padding-top:0}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:28px;margin-top:40px}
.stats .v{font-family:var(--serif);font-size:clamp(34px,4vw,50px);line-height:1}
.stats .k{font-size:14px;color:var(--muted);margin-top:10px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.specs>div{background:var(--ground);padding:26px}
.specs .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.specs .v{font-family:var(--serif);font-size:24px;margin-top:10px;line-height:1.3}
.specs .v.p{font-family:var(--sans);font-size:16px;line-height:1.6}
.specs .n{font-size:13px;color:var(--muted);margin-top:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gallery button{padding:0;border:0;background:var(--soft);cursor:zoom-in;aspect-ratio:3/2;overflow:hidden}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery button:hover img{transform:scale(1.04)}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px}
.panel{background:var(--night);color:#F7F5F1;padding:clamp(28px,4vw,48px)}
.panel h3{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3vw,38px);margin:10px 0 24px;line-height:1.15}
.panel .eyebrow{color:#D9C2A0}
.panel .stack{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);padding:clamp(24px,3vw,36px);text-decoration:none;display:flex;flex-direction:column;gap:10px;background:transparent}
.card:hover{border-color:var(--ink)}
.card .t{font-family:var(--serif);font-size:26px;line-height:1.2}
.foot{background:var(--night);color:#B9B2A6;margin-top:0}
.foot .wrap{display:flex;flex-wrap:wrap;gap:24px 40px;justify-content:space-between;align-items:center;padding-top:52px;padding-bottom:52px}
.foot .brands{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;color:#F7F5F1}
.foot .b1{font-family:var(--serif);font-size:16px;letter-spacing:.22em}
.foot .b2{font-size:16px;letter-spacing:.06em}
.foot .sep{width:1px;height:28px;background:#3A4248}
.mbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:none;gap:8px;padding:8px;background:rgba(22,25,27,.96);backdrop-filter:blur(8px);transform:translateY(calc(100% + 30px));opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
.mbar.on{transform:none;opacity:1;pointer-events:auto}
.mbar .btn{min-height:48px}
.mbar .ic{width:48px;padding:0;flex:none}
@media (max-width:760px){.mbar{display:flex}.story{padding-bottom:76px}}
/* Modes: one markup, three presentations */
.m-heritage .hero{height:auto;min-height:0;background:var(--ground);color:var(--ink)}
.m-heritage .hero img{position:relative;height:clamp(360px,56vh,620px);animation:none}
.m-heritage .hero .scrim{display:none}
.m-heritage .topnav{position:relative;color:var(--ink)}
.m-heritage .topnav .tn a.cta,.m-heritage .topnav .menu{border-color:var(--ink);background:transparent}
.m-heritage .hero .photo{padding:0 clamp(20px,4vw,48px)}
.m-heritage .hero .copy{position:relative;text-align:center;padding-top:40px}
.m-heritage .hero h1{margin:14px auto 0;font-size:clamp(40px,5.6vw,80px)}
.m-heritage .hero .meta{justify-content:center}
.m-heritage .hero .eyebrow{color:var(--accent)}
.m-heritage .full{height:auto}.m-heritage .full img{position:relative;height:clamp(360px,56vh,620px)}.m-heritage .full .scrim{display:none}
.m-heritage .full .inner{position:relative;color:var(--ink);padding:40px clamp(20px,4vw,48px) 0;bottom:auto}
.m-heritage .full{background:var(--ground)}
.m-arch{--serif:'Inter',system-ui,sans-serif}
.m-arch .hero h1,.m-arch .chapter h2,.m-arch .full h2,.m-arch .lede p.big{font-weight:300;letter-spacing:-.025em}
.m-arch .dark{background:#2B2F33}
.m-arch .chapter .head .n{font-family:var(--sans);font-size:13px;letter-spacing:.14em}
.m-arch .specs>div{background:#fff}
.m-arch .story,.m-arch{--ground:#FFFFFF}

/* ---------- Sheets & lightbox ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,16,18,.55)}
.sheet .box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--ground);color:var(--ink);padding:28px clamp(20px,4vw,36px) 32px;animation:rise .35s ease-out}
@media (min-width:700px){.sheet{align-items:center}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet .box{animation:none}}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:8px 0 16px;line-height:1.15}
.sheet .x{float:right;width:44px;height:44px;border:0;background:transparent;font-size:24px;cursor:pointer}
.lb{position:fixed;inset:0;z-index:70;background:#0E1012;display:flex;flex-direction:column}
.lb img{flex:1;object-fit:contain;width:100%;min-height:0}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#D8D2C7;font-size:14px;gap:12px}
.lb button{min-width:48px;min-height:48px;background:transparent;border:1px solid #3A4248;color:#F7F5F1;cursor:pointer}
.qa{display:flex;flex-direction:column;gap:14px;margin:8px 0 16px}
.qa .q{align-self:flex-end;background:var(--ink);color:var(--ground);padding:12px 16px;max-width:85%}
.qa .a{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:12px 16px;max-width:92%}
.qa .src{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- Private views (seller, desk) ---------- */
.private{min-height:100vh;background:var(--ground)}
.phone{max-width:560px;margin:0 auto}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.pbar .mark{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--accent)}
.pad{padding:0 24px}
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:28px}
.journey span{height:3px;background:var(--line)}.journey span.d{background:var(--ink)}.journey span.c{background:var(--accent)}
.jl{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted);gap:4px}
.jl b{color:var(--accent);font-weight:500}
.letter{background:var(--card);border:1px solid var(--line);padding:26px 24px;margin-top:28px}
.letter .serif{font-size:20px;line-height:1.45}
.ok-card{background:var(--night);color:#F7F5F1;padding:24px;margin-top:14px}
.ok-card .eyebrow{color:#D9C2A0}
.list{border-top:1px solid var(--line)}
.list>div{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.list .when{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles a{background:var(--card);border:1px solid var(--line);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tiles .t{font-family:var(--serif);font-size:19px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{min-height:40px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.reveal{position:relative;min-height:100vh;background:var(--night);color:#F7F5F1;overflow:hidden}
.reveal img.bg{position:absolute;top:0;left:0;width:100%;height:58vh;object-fit:cover}
.reveal .scrim{position:absolute;top:0;left:0;right:0;height:58vh;background:linear-gradient(180deg,rgba(22,25,27,.4) 0%,rgba(22,25,27,0) 30%,rgba(22,25,27,0) 50%,#16191B 100%)}
.reveal .inner{position:relative;max-width:560px;margin:0 auto;padding:calc(44vh) 24px 32px}
.reveal h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,10vw,56px);line-height:1.04;margin:14px 0 0}
.reveal .acts{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.reveal .acts .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metrics>div{background:var(--ground);padding:18px 14px 18px 0}
.metrics>div:nth-child(even){padding-left:14px}
.metrics .v{font-family:var(--serif);font-size:38px;line-height:1.1}
.metrics .s{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--ink);min-height:2px}
.bars div.pk{background:var(--accent)}
.src{display:flex;gap:12px;align-items:center;font-size:14px;margin-bottom:12px}
.src .lab{width:130px;flex:none}.src .tr{flex:1;height:6px;background:var(--line)}.src .tr i{display:block;height:6px;background:var(--ink)}.src .n{width:34px;text-align:right}
.notice{border:1px solid var(--line);padding:16px 18px;font-size:13px;line-height:1.55}
.banner{background:var(--soft);padding:12px 16px;font-size:13px}

/* Desk */
.desk .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0}
.desk .top .mark{font-family:var(--serif);font-size:13px;letter-spacing:.3em;color:var(--accent)}
.dhero{position:relative;height:clamp(300px,40vw,440px);overflow:hidden;background:var(--night);color:#F7F5F1}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,25,27,0) 35%,rgba(22,25,27,.85) 100%)}
.dhero .c{position:absolute;left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);bottom:clamp(22px,3vw,40px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.dhero h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.6vw,54px);line-height:1.05;margin:8px 0 0}
.dhero .eyebrow{color:#E7D7BF}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:8px}
.tabs a{flex:none;text-decoration:none;padding:16px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;min-height:44px}
.tabs a[aria-current=page]{color:var(--ink);border-color:var(--ink)}
.say{font-family:var(--serif);font-size:clamp(28px,3.4vw,44px);line-height:1.25;margin:clamp(40px,6vw,72px) 0 0;max-width:24ch;text-wrap:balance}
.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px;margin-top:40px}
.decision{background:var(--card);padding:clamp(26px,3.4vw,40px);display:flex;flex-direction:column;gap:14px}
.decision .t{font-family:var(--serif);font-size:clamp(21px,2.2vw,26px);line-height:1.35}
.decision .d{font-size:15px;line-height:1.6;color:#3A4248}
.decision .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;align-items:center}
.quiet{border-top:1px solid var(--line);padding:30px 0;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:baseline}
.quiet .serif{font-size:22px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);background:var(--soft)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.run{background:var(--card);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px}
.run .t{font-weight:500}
.run .d{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.log{font-size:14px}
.log>div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.preview{background:var(--card);border:1px solid var(--line);padding:20px;font-size:14px;line-height:1.65}
.result{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.result .ic{font-size:16px}.result.pass .ic{color:var(--ok)}.result.fail .ic{color:var(--warn)}
.score{font-family:var(--serif);font-size:clamp(56px,8vw,96px);line-height:1}

/* Navigator */
.navbtn{position:fixed;left:14px;bottom:14px;z-index:40;min-height:44px;padding:0 16px;border:1px solid rgba(247,245,241,.5);background:rgba(22,25,27,.88);color:#F7F5F1;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
@media (max-width:760px){.navbtn{left:auto;right:12px;bottom:12px;min-height:40px;padding:0 12px;font-size:11px}.story~.navbtn{bottom:88px}}
.navlist{display:flex;flex-direction:column}
.navlist a{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;min-height:44px}
.navlist a span:last-child{font-size:13px;color:var(--muted);text-align:right}

/* Sign (print) */
.signwrap{display:flex;justify-content:center;padding:32px 16px;background:var(--soft);min-height:100vh}
.sign{width:min(720px,100%);aspect-ratio:2/3;background:#F7F5F1;border:clamp(8px,2vw,14px) solid #1E2327;display:flex;flex-direction:column}
.sign .head{text-align:center;padding:clamp(28px,8%,64px) 24px 0}
.sign .w{font-family:var(--serif);font-size:clamp(44px,12vw,92px);line-height:1;margin-top:clamp(12px,3%,28px)}
.sign .qrs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,4%,40px);padding:clamp(24px,7%,56px) clamp(16px,7%,56px) 0}
.sign .qr{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2%,18px);text-align:center}
.sign .qr .code{width:100%;max-width:230px;aspect-ratio:1;background:#fff;padding:10px;border:1px solid var(--line)}
.sign .qr .code svg{width:100%;height:100%;display:block}
.sign .qr .t{font-family:var(--serif);font-size:clamp(18px,4.4vw,34px);line-height:1.15}
.sign .base{margin-top:auto;background:#1E2327;color:#F7F5F1;padding:clamp(18px,4%,34px) clamp(18px,8%,64px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--ground);padding:14px 20px;font-size:14px;max-width:90vw}

/* How it runs */
.how3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px}
.how3>div{background:var(--card);padding:22px}
.how3 p{margin:10px 0 0;font-size:15px;line-height:1.55;color:#3A4248}
.runcard{background:var(--card);padding:clamp(20px,3vw,30px);margin-bottom:14px}
.rh{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.rh .who{letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.rt{font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.2vw,24px);line-height:1.3;margin:8px 0 14px}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.steps li:last-child{border-bottom:0}
.steps .ic{font-size:15px;text-align:center;padding-top:1px}
.rules{border-top:1px solid var(--line)}
.rulerow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.rulerow .seg{flex:none}
@media (max-width:520px){.rulerow{flex-wrap:wrap}.rulerow .seg{width:100%}.rulerow .seg button{flex:1}}

.setuph{font-size:28px;margin:56px 0 10px}
.setupform{max-width:520px}

.tell{margin-top:32px;background:var(--card);padding:22px clamp(18px,3vw,28px)}
.tellrow{display:flex;margin-top:10px}
.tellrow input{flex:1;min-height:52px;padding:0 16px;border:1px solid var(--line);border-right:0;font-size:16px;background:var(--ground)}
.tellrow .btn{min-height:52px}

.kit{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 0 14px;margin:0 -4px}
.kit figure{flex:none;width:min(72vw,300px);margin:0 4px;scroll-snap-align:start}
.kit img{width:100%;height:auto;max-height:440px;object-fit:contain;background:#16191B;display:block;-webkit-touch-callout:default;user-select:auto}
.kit figcaption{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:8px}
.kit figcaption .row{display:flex;gap:6px;margin-left:-6px}

.placelist{display:flex;flex-direction:column;gap:26px}
.placelist h3{font-size:clamp(22px,2.2vw,28px);margin:0 0 6px;line-height:1.2}
.placelist p{margin:0 0 6px;font-size:16px;line-height:1.65;color:#3A4248;max-width:52ch}
.dark .placelist p{color:#D8D2C7}
.src-link{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.dark .src-link{color:#9C968B;border-color:#3A4248}
.next .card .btn{align-self:flex-start;margin-top:8px}
/* ---------- follow ---------- */
.fcard{display:block;text-decoration:none;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
/* ---------- books ---------- */
.book{background:var(--ground);min-height:100vh}
.bookbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px clamp(20px,4vw,48px);background:rgba(247,245,241,.94);border-bottom:1px solid var(--line)}
.bookbar .mark{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--accent)}
.bookbar .row{display:flex;align-items:center}
.btn.small{min-height:38px;padding:0 16px;font-size:13px}
.bcover{position:relative;height:min(86vh,820px);min-height:460px;background:var(--night);color:#F7F5F1;overflow:hidden}
.bcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,25,27,.15) 30%,rgba(22,25,27,.82) 100%)}
.bcover .c{position:absolute;left:0;right:0;bottom:0;max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(36px,6vw,72px)}
.bcover h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,88px);line-height:1.02;margin:14px 0 10px;max-width:14ch}
.bcover p{color:#D8D2C7;margin:0}
.bsec{padding-top:clamp(56px,8vw,96px)}
.bnote{font-size:clamp(21px,2.4vw,28px);line-height:1.5;margin:16px 0 10px}
.bnums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px 20px;margin:22px 0 18px}
.bnums .v{font-family:var(--serif);font-size:clamp(36px,4.4vw,52px);line-height:1}
.bnums .k{font-size:13px;color:var(--muted);margin-top:8px}
.bnums.light .k{color:#B9B2A6}
.btl>div{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.btl .d{font-size:13px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.bphotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.bphotos img{width:100%;aspect-ratio:4/3;object-fit:cover}
.bfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px;margin:20px 0}
.bfacts .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.bcare{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:18px}
.bcare>div{background:var(--card);border:1px solid var(--line);padding:22px}
.bcare h3{font-size:22px;margin:0 0 8px}
.bcare ul{margin:0;padding-left:18px;line-height:1.6;font-size:15px}
.favform{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-top:18px}
.favform input{min-height:48px;border:1px solid var(--line);background:var(--card);padding:0 12px}
@media (max-width:700px){.favform{grid-template-columns:1fr}.bphotos{grid-template-columns:1fr 1fr}}
.bookfoot{margin-top:clamp(64px,9vw,110px);padding:36px clamp(20px,4vw,48px) 48px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;color:var(--muted)}
.bookfoot .brands{display:flex;gap:14px;align-items:center;color:var(--ink)}
.bookfoot .b1{font-family:var(--serif);letter-spacing:.22em;font-size:14px}.bookfoot .b2{font-size:14px}.bookfoot .sep{width:1px;height:18px;background:var(--line)}
/* ---------- print & present hub ---------- */
.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kitgrid .card{min-height:150px}
.qsteps{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 26px;font-size:13px;color:var(--muted)}
.qsteps .c{color:var(--ink);font-weight:600;border-bottom:1px solid var(--accent)}.qsteps .d{color:var(--ok)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
fieldset{border:0;padding:0;margin:0}
/* ---------- silent talkers ---------- */
.talkers{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:30px 0 90px}
.talker{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;aspect-ratio:5/7;overflow:hidden}
.talker.t-easel{aspect-ratio:7/5;flex-direction:row}
.talker .tph{flex:0 0 44%}.talker .tph img{width:100%;height:100%;object-fit:cover}
.talker .tin{flex:1;display:flex;flex-direction:column;padding:clamp(22px,7%,40px);border:1px solid transparent}
.talker.t-tent .tin{border-color:var(--accent);margin:12px}
.talker h2{font-size:clamp(24px,2.4vw,32px);line-height:1.15;margin:14px 0 12px}
.talker p{font-size:15px;line-height:1.6;color:#3A4248;margin:0}
.talker.t-easel h2{font-size:22px}.talker.t-easel p{font-size:13.5px}
.tfoot{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid var(--line)}
.tbrand{display:flex;flex-direction:column;gap:3px}.tbrand .b1{font-family:var(--serif);font-size:11px;letter-spacing:.2em;color:var(--accent)}
.tqr{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.tqr .code{width:64px}.tqr .small{font-size:10px;color:var(--muted)}
/* ---------- presentation ---------- */
.deck{position:fixed;inset:0;background:var(--night);color:#F7F5F1;overflow:hidden;user-select:none}
.slide,.sl{position:absolute;inset:0}
.sl{display:flex;align-items:center;justify-content:center;background:var(--ground);color:var(--ink);padding:clamp(28px,6vw,96px)}
.sl .c{max-width:720px;position:relative}.sl .c.wide{max-width:1040px}
.sl h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,6.4vw,92px);line-height:1.02;margin:16px 0}
.sl h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.2vw,58px);line-height:1.08;margin:14px 0 22px}
.sl p{font-size:clamp(16px,1.5vw,20px);line-height:1.6}
.sl-photo{background:var(--night);color:#F7F5F1;align-items:flex-end;justify-content:flex-start}
.sl-photo img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl-photo .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,25,27,.1) 20%,rgba(22,25,27,.85) 100%)}
.sl-photo p{color:#D8D2C7}
.sl-split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.sl-split .ph img{width:100%;height:72vh;object-fit:cover}
.sl-dark{background:var(--night);color:#F7F5F1}
.sl-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:10px 0 26px}
.sl-steps div{border-top:1px solid var(--accent);padding-top:14px;font-size:clamp(14px,1.3vw,17px);line-height:1.4}
.sl-steps span{display:block;font-family:var(--serif);color:var(--accent);font-size:28px;margin-bottom:6px}
.sl-qa{background:var(--card);border:1px solid var(--line);padding:28px;margin:8px 0 22px}.sl-qa .q{color:var(--muted);margin:0 0 10px}.sl-qa .serif{font-size:clamp(20px,2vw,26px);margin:0}
.sl-locks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.sl-locks div{background:var(--card);border:1px solid var(--line);padding:22px;font-size:17px}
.phonemock{justify-self:center;width:min(340px,80%);aspect-ratio:9/17;background:var(--ground);border:10px solid var(--night);border-radius:34px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.pm-top{font-family:var(--serif);font-size:10px;letter-spacing:.3em;color:var(--accent)}.pm-h{font-size:24px}.pm-l{background:var(--card);border:1px solid var(--line);padding:16px}.pm-l p{font-size:15px;margin:8px 0 0}
.dctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(22,25,27,.72);color:#F7F5F1;padding:6px;border-radius:999px;font-size:13px;z-index:3}
.dctl button,.dctl a{min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 12px}
.dctl button:disabled{opacity:.3}.dctl span{padding:0 6px}
@media (max-width:760px){.sl-split{grid-template-columns:1fr;align-content:center}.sl-split .ph{display:none}.sl-steps{grid-template-columns:1fr 1fr}.sl{overflow:auto;align-items:flex-start}.sl-photo{align-items:flex-end}.phonemock{display:none}}
/* ---------- print ---------- */
@media print{
  .noprint,.navbtn,.mbar,.toast,.dctl,.desk .top,.desk .dhero,.desk .tabs,.banner{display:none!important}
  body,.private,.book{background:#fff}
  .talkers{display:block;padding:0}
  .talker{break-inside:avoid;page-break-after:always;width:5in;height:7in;aspect-ratio:auto;margin:0 auto;border:0}
  .talker.t-easel{width:7in;height:5in}
  .bcover{height:6.5in;min-height:0;break-after:page}
  .bsec{break-inside:avoid-page}
  .bookbar{display:none}
  a{text-decoration:none}
}
.consent-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:12px 0 0;text-align:center}.sheet .consent-note,.panel .consent-note{text-align:left}
/* ---------- place guide ---------- */
.pfig{margin:0;position:relative}.pfig img{width:100%;height:100%;object-fit:cover}
.pfig.ph{overflow:hidden}.pfig figcaption{position:absolute;right:8px;bottom:6px;font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hero .credit{position:absolute;right:clamp(16px,3vw,32px);bottom:12px;font-size:10px;color:rgba(255,255,255,.75);z-index:2}
.gintro{max-width:760px;margin:0 0 clamp(28px,4vw,44px)}.gintro .serif{font-size:clamp(21px,2.3vw,28px);line-height:1.45;margin:0}
.gfeature{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(20px,3vw,40px);margin-bottom:clamp(28px,4vw,48px);align-items:stretch}
.gfeature .pfig,.gfeature img.ph{height:100%;min-height:320px}
.gfacts{display:flex;flex-direction:column;justify-content:center;gap:20px;border-left:1px solid var(--line);padding-left:clamp(18px,3vw,36px)}
.gfacts .v{font-family:var(--serif);font-size:clamp(28px,3vw,40px);line-height:1}.gfacts .k{font-size:14px;color:var(--muted);margin-top:6px}
.dark .gfacts .k{color:#B9B2A6}.dark .gfacts{border-color:rgba(255,255,255,.18)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px}
.ggrid h3{font-size:20px;margin:4px 0 6px}.ggrid p{margin:0;font-size:15px;line-height:1.55;color:inherit;opacity:.85}
.ggrid .age{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.gtoc{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:30px}

@media (max-width:760px){.gfeature{grid-template-columns:1fr}.gfacts{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}.ggrid{grid-template-columns:1fr}}
.picks{background:var(--soft)}
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,3vw,40px)}
.pickgrid .pfig,.pickgrid img.ph{aspect-ratio:3/2;height:auto}
.pickgrid h3{font-size:clamp(22px,2.2vw,28px);margin:16px 0 8px}
.pickgrid p{margin:0;font-size:16px;line-height:1.65;color:#3A4248}
.picks .sig{font-family:var(--serif);font-style:italic;font-size:18px;margin:clamp(28px,4vw,44px) 0 0;color:var(--muted)}
@media (max-width:760px){.pickgrid{grid-template-columns:1fr}}
.pickgrid .nophoto{border-top:1px solid var(--accent);padding-top:6px}.pickgrid .nophoto h3{font-size:clamp(26px,2.6vw,34px)}.pickgrid .nophoto p{font-family:var(--serif);font-size:clamp(18px,1.7vw,21px);line-height:1.55}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.choice{border:0;padding:0;margin:0 0 18px}.choice legend{font-size:14px;color:var(--muted);margin-bottom:8px;padding:0}
.choice label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;margin:0 8px 8px 0;border:1px solid var(--line);background:var(--card);font-size:15px;cursor:pointer}
.choice input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.choice label:has(input:checked){border-color:var(--ink)}
/* ---------- answer-first blocks ---------- */
.h1k{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;line-height:1.5;color:#E7D7BF;font-weight:500;margin-bottom:14px}
.glance{margin-top:clamp(36px,5vw,56px);text-align:left;background:var(--card,#fff);border:1px solid var(--line);padding:clamp(22px,4vw,34px)}
.glance dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 32px;margin:16px 0 0}
.glance dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7A5C38;margin-bottom:4px}
.glance dd{margin:0;font-size:15px;line-height:1.55}.glance .src-link{font-size:11px;margin-left:4px}
.faq{background:var(--soft);padding:clamp(64px,8vw,110px) 0}
.faq h2{font-size:clamp(30px,3.6vw,44px);margin:0 0 26px}

<script>
/* Office adapter: outside claude.ai, the Desk talks to Chris's own Google engine. */
(function () {
  if (window.claude && window.claude.use) return;
  var ENGINE = 'https://script.google.com/macros/s/AKfycbz0ALnuwyuwKaRkr2sGS7N_TPJ3DIXYYRiLP7RiNlBvv5HfQMxfy82jS88ihRab7Duu/exec';
  var key = null; try { key = localStorage.getItem('ranch.officeKey'); } catch (e) {}
  if (!key) { location.replace('/?desk=1'); return; }
  function engine(body) {
    body.type = 'office'; body.key = key;
    return fetch(ENGINE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) { if (j.reason === 'locked') { try { localStorage.removeItem('ranch.officeKey'); } catch (e) {} location.replace('/?desk=1'); } throw { message: j.reason || 'Engine error' }; } return j; });
  }
  var mcp = { callTool: function (server, name, input) {
    if (/Metricool|Drive/.test(server)) return Promise.reject({ message: server + ' opens from claude.ai for now.' });
    return engine({ op: 'tool', server: server, name: name, input: input }).then(function (j) { return j.result; });
  } };
  var sample = function () { return Promise.reject({ message: 'Writing help isn’t in the office yet.' }); };
  sample.json = function (prompt) { return engine({ op: 'ai', prompt: prompt }).then(function (j) { return j.result; }); };
  window.claude = { use: function (n) {
    if (n === 'mcp') return Promise.resolve(mcp);
    if (n === 'sample') return engine({ op: 'ping' }).then(function (p) { if (!p.ai) throw 0; return sample; });
    return Promise.reject({ code: 'unavailable' });
  } };
  if (!location.hash) location.hash = '#desk';
  document.addEventListener('DOMContentLoaded', function () {
    var a = document.createElement('a'); a.href = '/'; a.textContent = '← Office'; a.className = 'office-back';
    a.setAttribute('style', 'position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#1E2327;color:#F7F5F1;font:500 13px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.18)');
    document.body.appendChild(a);
  });
})();
</script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';

function decisions() {
  const l = L(); const out = [];
  l.exceptions.filter(x => x.open).forEach(x => {
    if (x.type === 'judgment' && l.approvals.some(a => a.status === 'open' && a.kind === 'reply.seller_judgment' && x.data && a.key === 'reply:' + x.data.q)) return;
    out.push({ kind: 'ex', x });
  });
  l.approvals.filter(a => a.status === 'open' && a.who === 'staff').forEach(a => out.push({ kind: 'ap', a }));
  const rank = d => d.kind === 'ex' ? ({ authorization: 0, contract: 0.2, offer: 0.3, research: 0.8, fact: 1, judgment: 3, integration: 4, recheck: 6 }[d.x.type] ?? 5) : ({ 'reply.seller_judgment': 2, 'price.change': 1.5, 'send.seller_live': 0.5 }[d.a.kind] ?? 3);
  return out.sort((p, q) => rank(p) - rank(q));
}

function ruleSuggestions() {
  const l = L(), r = E.report(LID), v = r.metrics[0].value, sh = r.metrics[1].value, out = [];
  const live = ['active', 'market_engagement'].indexOf(l.state) >= 0;
  if (live && v >= 100 && sh / Math.max(1, v) < 0.02) out.push({ title: 'Lead with the deck instead of the great room', why: v + ' visits but only ' + sh + ' showing requests. Test a different first impression before anything else.', action: 'lead-photo', photo: 'deck-fire' });
  if (live && !l.openHouses.some(o => o.status === 'scheduled' || o.status === 'awaiting_seller')) out.push({ title: 'Hold an open house this weekend', why: 'No open house is on the calendar. Weekends drive the most visits in Tehaleh.', action: 'open-house' });
  const last = l.updates[0];
  if (live && (!last || Date.now() - last.at > 4 * 864e5)) out.push({ title: 'Send your seller a quick note', why: last ? 'It’s been ' + Math.floor((Date.now() - last.at) / 864e5) + ' days since they heard from you.' : 'They haven’t had a personal note yet.', action: 'seller-note' });
  if (!live && l.state === 'marketing_ready') out.push({ title: 'Everything is ready for launch', why: 'Photos, facts and story are approved. The moment NWMLS shows Active and you authorize it, launch runs itself.', action: 'none' });
  return out.slice(0, 3);
}

const SOC_OFFERED = 2.5;

function offerCompare(rs, money, esc, soc) {
